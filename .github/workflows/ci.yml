name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Typecheck & tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: logos-mcp-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: logos-mcp-server/package-lock.json
      # `npm ci`, not `npm install`: the lockfile is the point of a CI install.
      - run: npm ci
      # Typecheck AND build, because `build` is `tsc` and dist/ is what the
      # published server runs — a type error that only the emit surfaces would
      # otherwise reach a release.
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm test
      # No BIBLIA_API_KEY is set anywhere here, deliberately: the suite mocks
      # fetch, and a CI job that needed a real key would either leak one into a
      # fork's logs or fail on every fork PR.
